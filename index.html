<body class="min-h-screen flex justify-center bg-[#140D0B]">

  <div id="app" class="w-full max-w-md min-h-screen bg-[#1E1513] flex flex-col justify-between shadow-2xl relative pb-24">
    <!-- Header mit fest eingebautem 3D-Icon -->
    <header class="sticky top-0 z-20 bg-[#1E1513]/95 backdrop-blur-md px-5 pt-4 pb-3 border-b border-[#332420] flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="header-app-icon" alt="Logo" class="w-11 h-11 rounded-2xl object-cover shadow-md border border-[#FF8A5B]/40" />
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-white leading-tight">Unser Essen</h1>
          <div class="flex items-center gap-1.5 text-xs text-[#C7B2AA]">
            <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="header-subtitle">Jonas & Samira</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="manualSync()" class="px-3 py-1.5 rounded-full bg-[#332420] text-[#FF8A5B] text-xs font-bold flex items-center gap-1.5 active:scale-95 transition">
        <span>🔄</span> <span id="sync-code-badge">JS27</span>
      </button>
        <button onclick="switchTab('couple')" aria-label="Einstellungen" class="w-9 h-9 rounded-full bg-[#332420] text-base flex items-center justify-center active:scale-95 transition">⚙️</button>
      </div>
    </header>

    <main id="main-content" class="flex-1 px-5 pt-4 pb-6 overflow-y-auto"></main>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 bg-[#F26419] text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2">
      <span id="toast-text">Gespeichert!</span>
    </div>

    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#261B18]/95 backdrop-blur-md border-t border-[#382722] px-3 py-2 z-30 flex justify-around items-center">
      <button onclick="switchTab('randomizer')" id="nav-randomizer" class="flex flex-col items-center gap-1 py-1 px-3 rounded-2xl transition">

  </div>

  <!-- Modal -->
  <div id="meal-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#261B18] text-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh] overflow-y-auto animate-pop shadow-2xl border border-[#3E2C27]">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-lg font-extrabold">Neues Gericht</h2>
        <button onclick="closeMealModal()" class="w-8 h-8 rounded-full bg-[#382722] flex items-center justify-center font-bold text-[#C7B2AA]">✕</button>
      </div>
      <form onsubmit="saveMeal(event)" class="space-y-4">
        <input type="hidden" id="meal-id" />
        <div>
          <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Name des Gerichts *</label>
          <input id="meal-name" required placeholder="z.B. Basmati-Reis-Curry mit Hähnchen" class="w-full px-4 py-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Emoji</label>
            <input id="meal-emoji" value="🍛" class="w-full px-4 py-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white" />
          </div>
          <div>
            <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Dauer (Min.)</label>
            <input id="meal-time" type="number" value="25" class="w-full px-4 py-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Kategorien</label>
          <div id="modal-tags" class="flex flex-wrap gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Zutaten (mit Komma trennen)</label>
          <input id="meal-ingredients" placeholder="z.B. Basmati-Reis, Hähnchenbrust, Kokosmilch" class="w-full px-4 py-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white" />
        </div>
        <div>
          <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Notiz (optional)</label>
          <input id="meal-note" placeholder="z.B. Im Monsieur Cuisine 18 Min. garen" class="w-full px-4 py-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeMealModal()" class="flex-1 py-3.5 rounded-2xl bg-[#382722] text-[#C7B2AA] font-bold text-sm">Abbrechen</button>
          <button type="submit" class="flex-1 py-3.5 rounded-2xl bg-[#F26419] text-white font-bold text-sm shadow-md">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Zeichnet das 3D Foodie & Paar Icon (Design 2: Schüssel, Dampf, 2 schwebende Würfel & Herz) direkt als hochauflösendes PNG
    let GLOBAL_ICON_URL = '';
    (function buildEmbedded3DIcon() {
      function drawIcon(size, maskable) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');
        const s = size / 512;
        ctx.scale(s, s);

        // 1. 3D Abgerundeter Hintergrund (Warmes Terracotta-Orange mit Glanz)
        const bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
        bgGrad.addColorStop(0, '#FF7A29');
        bgGrad.addColorStop(0.5, '#D94B1E');
        bgGrad.addColorStop(1, '#8F250C');
        ctx.fillStyle = bgGrad;
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, maskable ? 0 : 115);
        ctx.fill();

        // Innerer 3D-Rahmen-Glanz
        ctx.strokeStyle = 'rgba(255, 200, 160, 0.35)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        if (!maskable) { ctx.roundRect(18, 18, 476, 476, 98); ctx.stroke(); } else { ctx.translate(256, 256); ctx.scale(0.78, 0.78); ctx.translate(-256, -256); }

        // 2. Leuchtendes 3D-Herz oben in der Mitte
        ctx.save();
        ctx.shadowColor = 'rgba(255, 80, 100, 0.6)';
        ctx.shadowBlur = 24;
        const heartGrad = ctx.createRadialGradient(245, 115, 5, 256, 130, 55);
        heartGrad.addColorStop(0, '#FF9E9E');
        heartGrad.addColorStop(0.5, '#FF4757');
        heartGrad.addColorStop(1, '#B3192B');
        ctx.fillStyle = heartGrad;
        ctx.beginPath();
        ctx.moveTo(256, 172);
        ctx.bezierCurveTo(256, 172, 198, 136, 198, 102);
        ctx.bezierCurveTo(198, 78, 226, 68, 256, 96);
        ctx.bezierCurveTo(286, 68, 314, 78, 314, 102);
        ctx.bezierCurveTo(314, 136, 256, 172, 256, 172);
        ctx.fill();
        ctx.restore();

        // 3. Schwebender 3D-Würfel links
        ctx.save();
        ctx.translate(135, 205);
        ctx.rotate(-0.28);
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        const diceGrad = ctx.createLinearGradient(-45, -45, 45, 45);
        diceGrad.addColorStop(0, '#FFFFFF');
        diceGrad.addColorStop(1, '#E6DCD5');
        ctx.fillStyle = diceGrad;
        ctx.beginPath();
        ctx.roundRect(-44, -44, 88, 88, 22);
        ctx.fill();
        // Würfelpunkte
        ctx.fillStyle = '#D94B1E';
        [[-20, -20], [20, -20], [0, 0], [-20, 20], [20, 20]].forEach(([dx, dy]) => {
          ctx.beginPath(); ctx.arc(dx, dy, 7.5, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();

        // 4. Schwebender 3D-Würfel rechts
        ctx.save();
        ctx.translate(378, 195);
        ctx.rotate(0.32);
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 8;
        ctx.fillStyle = '#FFF9F5';
        ctx.beginPath();
        ctx.roundRect(-42, -42, 84, 84, 20);
        ctx.fill();
        ctx.fillStyle = '#2E7D32';
        [[-18, -18], [0, 0], [18, 18]].forEach(([dx, dy]) => {
          ctx.beginPath(); ctx.arc(dx, dy, 7.5, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();

        // 5. Warmer Dampf über der Schüssel
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 240, 225, 0.65)';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        [220, 256, 292].forEach((x, idx) => {
          ctx.beginPath();
          ctx.moveTo(x, 275);
          ctx.quadraticCurveTo(x - 14, 248, x + 6, 225 - (idx === 1 ? 12 : 0));
          ctx.stroke();
        });
        ctx.restore();

        // 6. 3D Keramik-Schüssel (unten)
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.45)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 14;

        // Schüssel-Körper
        const bowlGrad = ctx.createLinearGradient(110, 290, 390, 440);
        bowlGrad.addColorStop(0, '#FFA45B');
        bowlGrad.addColorStop(0.5, '#E06324');
        bowlGrad.addColorStop(1, '#9E330C');
        ctx.fillStyle = bowlGrad;
        ctx.beginPath();
        ctx.arc(256, 295, 140, 0, Math.PI, false);
        ctx.fill();

        // Schüssel-Fuß
        ctx.fillStyle = '#872908';
        ctx.beginPath();
        ctx.roundRect(206, 422, 100, 18, 9);
        ctx.fill();

        // Leckeres Curry / Gericht oben in der Schüssel
        ctx.fillStyle = '#C93B14';
        ctx.beginPath();
        ctx.ellipse(256, 295, 132, 34, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bunte Zutaten-Highlights in der Schüssel
        const toppings = [
          { x: 205, y: 292, r: 16, c: '#4CAF50' },
          { x: 255, y: 286, r: 18, c: '#FFD166' },
          { x: 305, y: 294, r: 15, c: '#4CAF50' },
          { x: 235, y: 304, r: 14, c: '#FFF3E0' },
          { x: 280, y: 302, r: 14, c: '#FF6B6B' }
        ];
        toppings.forEach(t => {
          ctx.fillStyle = t.c;
          ctx.beginPath();
          ctx.ellipse(t.x, t.y, t.r, t.r * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // Heller Schüssel-Rand
        ctx.strokeStyle = '#FFC085';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.ellipse(256, 295, 136, 36, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        return c.toDataURL('image/png');
      }

      const icon192 = drawIcon(192);
      const icon512 = drawIcon(512);
      GLOBAL_ICON_URL = icon512;

      // Im Header sofort setzen
      window.addEventListener('DOMContentLoaded', () => {
        const headerImg = document.getElementById('header-app-icon');
        if (headerImg) headerImg.src = icon192;
      });

      // Favicon & Apple Touch Icon setzen
      const link1 = document.createElement('link');
      link1.rel = 'icon';
      link1.type = 'image/png';
      link1.href = icon192;
      document.head.appendChild(link1);

      const link2 = document.createElement('link');
      link2.rel = 'apple-touch-icon';
      link2.href = icon192;
      document.head.appendChild(link2);

    })();

    const CATEGORIES = [
      { id: 'alle', label: 'Alle', icon: '✨' },
      { id: 'schnell', label: 'Schnell', icon: '⚡' },
      { id: 'airfryer', label: 'Airfryer', icon: '🍟' },
      { id: 'monsieur', label: 'Monsieur Cuisine', icon: '🤖' },
      { id: 'protein', label: 'High Protein', icon: '💪' },
      { id: 'liebling', label: 'Lieblingsessen', icon: '❤️' }
    ];

    const QUICK_GROCERIES = [
      'Basmati-Reis', 'Hähnchenbrust', 'Tortilla-Wraps', 'Magerquark',
      'Passierte Tomaten', 'Reibekäse', 'Kartoffeln', 'Paprika',
      'Zwiebeln', 'Kokosmilch', 'Eier', 'Milch'
    ];

    const DEFAULT_STATE = {
      partner1: 'Jonas',
      partner2: 'Samira',
      pairCode: 'JS27',
      updatedAt: 0,
      meals: [
        { id: 'm1', name: 'Cremiges Basmati-Reis-Curry mit Hähnchen', emoji: '🍛', time: 25, tags: ['monsieur', 'protein', 'liebling'], ingredients: ['Basmati-Reis', 'Hähnchenbrust', 'Kokosmilch', 'Currypaste', 'Paprika'], note: 'Reis & Sauce super easy im Monsieur Cuisine', active: true, addedBy: 'Jonas' },
        { id: 'm2', name: 'Knusprige Hähnchen-Wraps', emoji: '🌯', time: 15, tags: ['schnell', 'airfryer', 'protein', 'liebling'], ingredients: ['Tortilla-Wraps', 'Hähnchenstreifen', 'Salat', 'Mais', 'Joghurt-Dressing'], note: 'Hähnchen im Ninja Airfryer knusprig backen', active: true, addedBy: 'Samira' },
        { id: 'm3', name: 'Selbstgemachte Pizza (Haus-Teig)', emoji: '🍕', time: 35, tags: ['monsieur', 'liebling'], ingredients: ['Pizzamehl', 'Trockenhefe', 'Passierte Tomaten', 'Mozzarella', 'Salami'], note: 'Pizzateig im Monsieur Cuisine kneten lassen', active: true, addedBy: 'Jonas' },
        { id: 'm4', name: 'Airfryer Kartoffel-Wedges & Kräuterquark', emoji: '🥔', time: 20, tags: ['airfryer', 'schnell', 'protein'], ingredients: ['Kartoffeln', 'Magerquark', 'Kräuter', 'Knoblauchpulver'], note: '200 Grad im Airfryer für perfekte Knusprigkeit', active: true, addedBy: 'Samira' },
        { id: 'm5', name: 'Pasta Bolognese (Klassiker)', emoji: '🍝', time: 25, tags: ['monsieur', 'liebling'], ingredients: ['Spaghetti', 'Rinderhackfleisch', 'Passierte Tomaten', 'Karotten', 'Parmesan'], note: 'Geht immer!', active: true, addedBy: 'Jonas' },
        { id: 'm6', name: 'Frische Quark-Öl-Semmeln', emoji: '🥨', time: 25, tags: ['monsieur', 'airfryer', 'protein'], ingredients: ['Magerquark', 'Mehl', 'Backpulver', 'Milch', 'Aufschnitt & Käse'], note: 'Warm aus dem Ofen oder Airfryer ein Traum', active: true, addedBy: 'Jonas' }
      ],
      shopping: [
        { id: 's1', text: 'Basmati-Reis', done: false, addedBy: 'Jonas' },
        { id: 's2', text: 'Tortilla-Wraps', done: false, addedBy: 'Samira' }
      ],
      history: [],
      deleted: {},
      me: 1,
      cooldownDays: 5
    };

    // ---------- Helfer: Escaping, Bereinigung, Merge, Kompression ----------
    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function sid(v) { return String(v ?? '').replace(/[^\w-]/g, '').slice(0, 40); }
    function str(v, n = 120) { return String(v ?? '').slice(0, n); }
    function cleanMeal(m) {
      m = m || {};
      return {
        id: sid(m.id), name: str(m.name), emoji: str(m.emoji, 8),
        time: Math.min(999, Math.max(1, parseInt(m.time, 10) || 25)),
        tags: (Array.isArray(m.tags) ? m.tags : []).map(t => sid(t)).filter(Boolean).slice(0, 10),
        ingredients: (Array.isArray(m.ingredients) ? m.ingredients : []).map(i => str(i, 60)).filter(Boolean).slice(0, 30),
        note: str(m.note, 200), active: m.active !== false, addedBy: str(m.addedBy, 30), ts: +m.ts || 0
      };
    }
    function cleanItem(i) {
      i = i || {};
      const o = { id: sid(i.id), text: str(i.text, 80), done: !!i.done, addedBy: str(i.addedBy, 30), ts: +i.ts || 0 };
      if (i.fromMeal) o.fromMeal = str(i.fromMeal, 120);
      return o;
    }
    function cleanHist(h) {
      h = h || {};
      return { id: sid(h.id), mealId: sid(h.mealId), name: str(h.name), emoji: str(h.emoji, 8), date: str(h.date, 30) };
    }
    function cleanLists(p) {
      const out = {};
      if (!p || typeof p !== 'object') return out;
      if (Array.isArray(p.meals)) out.meals = p.meals.map(cleanMeal).filter(m => m.id && m.name);
      if (Array.isArray(p.shopping)) out.shopping = p.shopping.map(cleanItem).filter(i => i.id && i.text);
      if (Array.isArray(p.history)) out.history = p.history.map(cleanHist).filter(h => h.id).slice(0, 15);
      if (Array.isArray(p.plan)) out.plan = p.plan.map(x => ({ id: sid(x && x.id), mealId: sid(x && x.mealId), ts: +(x && x.ts) || 0 })).filter(x => /^d[0-6]$/.test(x.id));
      if (p.deleted && typeof p.deleted === 'object') {
        out.deleted = {};
        for (const k in p.deleted) { const id = sid(k); if (id) out.deleted[id] = +p.deleted[k] || 0; }
      }
      return out;
    }
    function me() { return state.me === 2 ? state.partner2 : state.partner1; }

    // Änderungen pro Eintrag mit Zeitstempel versehen (ts) und Löschungen merken (deleted)
    let snap = {};
    function rebuildSnap() {
      snap = {};
      [...state.meals, ...state.shopping, ...(state.plan || [])].forEach(it => { const { ts, ...r } = it; snap[it.id] = JSON.stringify(r); });
    }
    function stamp() {
      const now = Date.now(), cur = {};
      state.deleted = state.deleted || {};
      [...state.meals, ...state.shopping, ...(state.plan || [])].forEach(it => {
        const { ts, ...r } = it, j = JSON.stringify(r);
        cur[it.id] = 1;
        if (snap[it.id] !== j) { it.ts = now; snap[it.id] = j; }
      });
      Object.keys(snap).forEach(id => { if (!cur[id]) { state.deleted[id] = now; delete snap[id]; } });
    }

    // Eingehenden Stand mit dem lokalen zusammenführen (pro Eintrag gewinnt der neuere)
    function applyIncoming(inc) {
      const c = cleanLists(inc);
      const snapshot = () => JSON.stringify([state.meals, state.shopping, state.history, state.deleted, state.plan]);
      const before = snapshot();
      const del = { ...(state.deleted || {}) };
      for (const k in (c.deleted || {})) del[k] = Math.max(del[k] || 0, c.deleted[k]);
      const cutoff = Date.now() - 14 * 864e5;
      for (const k in del) if (del[k] < cutoff) delete del[k];
      const mergeList = (a, b) => {
        const m = new Map();
        [...(a || []), ...(b || [])].forEach(it => {
          const o = m.get(it.id);
          if (!o || (it.ts || 0) > (o.ts || 0)) m.set(it.id, it);
        });
        return [...m.values()].filter(it => !(del[it.id] && del[it.id] >= (it.ts || 0)));
      };
      const hist = new Map();
      [...(state.history || []), ...(c.history || [])].filter(h => !del[h.id]).forEach(h => hist.set(h.id, h));
      state.meals = mergeList(state.meals, c.meals);
      state.shopping = mergeList(state.shopping, c.shopping);
      state.plan = mergeList(state.plan, c.plan); ensurePlan(state);
      state.history = [...hist.values()].sort((a, b) => (parseInt(b.id.slice(2), 10) || 0) - (parseInt(a.id.slice(2), 10) || 0)).slice(0, 15);
      state.deleted = del;
      if (snapshot() === before) return false;
      rebuildSnap(); saveLocalState(); render();
      return true;
    }

    // ntfy erlaubt ~4 KB pro Nachricht -> gzip + base64, nur geteilte Daten (keine Namen/Code)
    async function packState() {
      const json = JSON.stringify({ meals: state.meals, shopping: state.shopping, history: state.history, plan: state.plan, deleted: state.deleted, updatedAt: state.updatedAt });
      if (!('CompressionStream' in window)) return json;
      const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      let bin = '';
      new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
      return 'z1:' + btoa(bin);
    }
    async function unpackState(msg) {
      if (!msg.startsWith('z1:')) return JSON.parse(msg);
      const arr = Uint8Array.from(atob(msg.slice(3)), ch => ch.charCodeAt(0));
      const text = await new Response(new Blob([arr]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      return JSON.parse(text);
    }

    // ---------- Verlauf & Wiederholungssperre ----------
    const COOLDOWN_OPTIONS = [0, 3, 5, 7, 14];
    function histTime(h) { return parseInt(String(h.id).slice(2), 10) || 0; }
    function isOnCooldown(m) {
      const days = state.cooldownDays || 0;
      if (!days) return false;
      const since = Date.now() - days * 864e5;
      return (state.history || []).some(h => histTime(h) >= since && (h.mealId ? h.mealId === m.id : h.name === m.name));
    }
    function setCooldown(d) { state.cooldownDays = d; saveLocalState(); render(); }
    function removeHistory(id) {
      state.history = (state.history || []).filter(h => h.id !== id);
      state.deleted = state.deleted || {};
      state.deleted[id] = Date.now();
      pushCloudState();
      render();
    }
    function historyCardHtml() {
      const days = state.cooldownDays || 0;
      const blocked = state.meals.filter(m => m.active && isOnCooldown(m)).length;
      const list = (state.history || []).slice(0, 5);
      return `
        <div class="bg-[#261B18] rounded-3xl p-5 border border-[#3E2C27] mt-5">
          <h3 class="text-sm font-extrabold text-white mb-1">🕘 Zuletzt gegessen</h3>
          ${list.length === 0 ? `<p class="text-xs text-[#C7B2AA]">Noch nichts – tippe beim Auslosen auf „Heute essen wir das!“.</p>` : `<div class="space-y-1.5 mt-2">${list.map(h => `
            <div class="flex items-center justify-between gap-2 bg-[#1A1210] rounded-2xl px-3 py-2">
              <span class="text-sm font-semibold text-white truncate">${esc(h.emoji || '🍽️')} ${esc(h.name)}</span>
              <span class="flex items-center gap-2 shrink-0">
                <span class="text-[11px] font-bold text-[#C7B2AA]">${esc(h.date)}</span>
                <button onclick="removeHistory('${h.id}')" class="text-[#C7B2AA] text-xs font-bold">✕</button>
              </span>
            </div>`).join('')}</div>`}
          <div class="mt-4 pt-4 border-t border-[#382722]">
            <p class="text-xs font-bold text-[#C7B2AA] mb-2">🔒 Wiederholungssperre</p>
            <div class="flex gap-2">${COOLDOWN_OPTIONS.map(d => `<button onclick="setCooldown(${d})" class="flex-1 py-2 rounded-xl text-xs font-bold border transition ${
              days === d ? 'bg-[#3D2218] border-[#F26419] text-[#FF8A5B]' : 'bg-[#1A1210] border-transparent text-[#C7B2AA]'
            }">${d === 0 ? 'Aus' : d + ' Tage'}</button>`).join('')}</div>
            <p class="text-[11px] text-[#C7B2AA] mt-2">${days
              ? `Gerichte der letzten ${days} Tage werden nicht ausgelost${blocked ? ' (' + blocked + ' gerade gesperrt)' : ''}. Gilt nur auf diesem Gerät.`
              : 'Aus: jedes Gericht kann jederzeit wieder kommen.'}</p>
          </div>
        </div>`;
    }

    // ---------- Wochenplan ----------
    const DAY_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    function ensurePlan(st) {
      const have = new Map((st.plan || []).map(x => [x.id, x]));
      st.plan = DAY_SHORT.map((_, i) => have.get('d' + i) || { id: 'd' + i, mealId: '', ts: 0 });
    }
    function planMeal(i) { return state.meals.find(m => m.id === state.plan[i].mealId); }
    function setPlanMeal(i, mealId) { state.plan[i].mealId = sid(mealId); pushCloudState(); render(); }
    function shuffled(a) {
      const r = [...a];
      for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
      return r;
    }
    function rollPlanDay(i) {
      const used = new Set(state.plan.filter((_, j) => j !== i).map(p => p.mealId));
      let pool = state.meals.filter(m => m.active && !used.has(m.id));
      if (!pool.length) pool = state.meals.filter(m => m.active);
      if (!pool.length) { showToast('Keine aktiven Gerichte vorhanden'); return; }
      setPlanMeal(i, pool[Math.floor(Math.random() * pool.length)].id);
    }
    function rollPlanWeek() {
      const empty = state.plan.map((_, i) => i).filter(i => !planMeal(i));
      const active = state.meals.filter(m => m.active);
      if (!empty.length) { showToast('Alle Tage sind schon belegt'); return; }
      if (!active.length) { showToast('Keine aktiven Gerichte vorhanden'); return; }
      let pool = shuffled(active.filter(m => !state.plan.some(p => p.mealId === m.id)));
      empty.forEach(i => { if (!pool.length) pool = shuffled(active); state.plan[i].mealId = pool.pop().id; });
      pushCloudState(); render();
    }
    function clearPlan() {
      if (!confirm('Wochenplan leeren?')) return;
      state.plan.forEach(p => { p.mealId = ''; });
      pushCloudState(); render();
    }
    function addPlanToCart() {
      const ids = [...new Set(state.plan.map(p => p.mealId).filter(Boolean))];
      let added = 0, used = 0;
      ids.forEach(id => {
        const meal = state.meals.find(m => m.id === id);
        if (!meal) return;
        used++;
        (meal.ingredients || []).forEach(ing => {
          const clean = ing.trim();
          if (!clean || state.shopping.some(it => it.text.toLowerCase() === clean.toLowerCase() && !it.done)) return;
          state.shopping.unshift({ id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), text: clean, fromMeal: meal.name, done: false, addedBy: me() });
          added++;
        });
      });
      if (!used) { showToast('Noch keine Gerichte im Plan'); return; }
      pushCloudState();
      showToast(`🛒 ${added} Zutat(en) von ${used} Gericht(en) hinzugefügt`);
      render();
    }
    function planHtml() {
      const today = (new Date().getDay() + 6) % 7;
      const planned = state.plan.filter((_, i) => planMeal(i)).length;
      return `
        <div class="space-y-4">
          <div>
            <h2 class="text-lg font-extrabold text-white">Wochenplan</h2>
            <p class="text-xs text-[#C7B2AA]">${planned} von 7 Tagen geplant · gemeinsam für ${esc(state.partner1)} & ${esc(state.partner2)}</p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="rollPlanWeek()" class="py-3 rounded-2xl bg-[#F26419] text-white font-extrabold text-xs shadow-md active:scale-95 transition">🎲 Leere Tage auslosen</button>
            <button onclick="addPlanToCart()" class="py-3 rounded-2xl bg-[#261B18] border border-[#3E2C27] text-[#FF8A5B] font-extrabold text-xs active:scale-95 transition">🛒 Zutaten → Einkauf</button>
          </div>
          <div class="space-y-2">
            ${state.plan.map((p, i) => `
              <div class="bg-[#261B18] rounded-2xl p-3 border ${i === today ? 'border-[#F26419]' : 'border-[#3E2C27]'} flex items-center gap-2">
                <div class="w-12 shrink-0">
                  <p class="text-sm font-extrabold ${i === today ? 'text-[#FF8A5B]' : 'text-white'}">${DAY_SHORT[i]}</p>${i === today ? '<p class="text-[10px] font-bold text-[#FF8A5B]">heute</p>' : ''}
                </div>
                <select onchange="setPlanMeal(${i}, this.value)" class="flex-1 min-w-0 px-3 py-2.5 rounded-xl bg-[#1A1210] border border-[#3E2C27] text-sm font-semibold text-white">
                  <option value="">– noch nichts –</option>
                  ${state.meals.filter(x => x.active || x.id === p.mealId).map(x => `<option value="${x.id}" ${x.id === p.mealId ? 'selected' : ''}>${esc(x.emoji || '🍽️')} ${esc(x.name)}</option>`).join('')}
                </select>
                <button onclick="rollPlanDay(${i})" aria-label="Zufällig" class="w-10 h-10 shrink-0 rounded-xl bg-[#1A1210] text-base active:scale-95 transition">🎲</button>
              </div>`).join('')}
          </div>
          ${planned > 0 ? '<button onclick="clearPlan()" class="w-full py-2.5 text-xs font-bold text-[#C7B2AA]">Plan leeren</button>' : ''}
        </div>`;
    }

    let state = loadLocalState();
    rebuildSnap();
    let currentTab = 'randomizer';
    let selectedFilter = 'alle';
    let maxTimeFilter = 999;
    let pickedMeal = null;
    let isRolling = false;
    let modalSelectedTags = ['schnell'];

    function loadLocalState() {
      const st = JSON.parse(JSON.stringify(DEFAULT_STATE));
      try {
        const raw = localStorage.getItem('essens_app_state_v1');
        if (raw) {
          const p = JSON.parse(raw);
          Object.assign(st, cleanLists(p));
          st.partner1 = str(p.partner1, 30) || st.partner1;
          st.partner2 = str(p.partner2, 30) || st.partner2;
          st.pairCode = str(p.pairCode, 30) || st.pairCode;
          st.me = p.me === 2 ? 2 : 1;
          st.cooldownDays = COOLDOWN_OPTIONS.includes(+p.cooldownDays) ? +p.cooldownDays : 5;
          st.updatedAt = +p.updatedAt || 0;
        }
      } catch (e) {}
      ensurePlan(st);
      return st;
    }

    function saveLocalState() {
      try { localStorage.setItem('essens_app_state_v1', JSON.stringify(state)); } catch (e) {}
      updateHeaderAndBadges();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      t.classList.remove('opacity-0');
      t.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.classList.remove('opacity-100');
        t.classList.add('opacity-0');
      }, 2400);
    }

    function getTopicName() {
      const clean = (state.pairCode || 'JS27').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
      return 'essens_app_sync_jk_' + clean;
    }

    let eventSource = null;
    function setSyncDot(ok) {
      const d = document.getElementById('sync-dot');
      if (!d) return;
      d.classList.toggle('bg-emerald-400', ok);
      d.classList.toggle('animate-pulse', ok);
      d.classList.toggle('bg-red-400', !ok);
    }
    function connectLiveSync() {
      if (eventSource) { try { eventSource.close(); } catch (e) {} }
      try {
        eventSource = new EventSource(`https://ntfy.sh/${getTopicName()}/sse?since=latest`);
        eventSource.onopen = () => setSyncDot(true);
        eventSource.onerror = () => setSyncDot(false);
        eventSource.onmessage = async (event) => {
          try {
            const wrapper = JSON.parse(event.data);
            if (!wrapper.message) return;
            if (applyIncoming(await unpackState(wrapper.message))) showToast('🔄 Live aktualisiert!');
          } catch (err) {}
        };
      } catch (e) {}
    }

    async function pushCloudState() {
      stamp();
      state.updatedAt = Date.now();
      saveLocalState();
      try {
        const body = await packState();
        if (body.length > 4000) { showToast('⚠️ Zu viele Daten für den Sync'); return; }
        await fetch(`https://ntfy.sh/${getTopicName()}`, { method: 'POST', body });
      } catch (e) {}
    }

    async function fetchLatestFromCloud() {
      try {
        const res = await fetch(`https://ntfy.sh/${getTopicName()}/json?poll=1&since=48h`);
        const lines = (await res.text()).trim().split('\n').filter(Boolean);
        let changed = false;
        for (const line of lines.slice(-5)) {
          try {
            const w = JSON.parse(line);
            if (w.message && applyIncoming(await unpackState(w.message))) changed = true;
          } catch (e) {}
        }
        return changed;
      } catch (e) { return false; }
    }

    async function manualSync() {
      showToast('Synchronisiere...');
      await fetchLatestFromCloud();
      await pushCloudState();
      showToast('Synchronisiert ✓');
    }

    function updateHeaderAndBadges() {
      document.getElementById('header-subtitle').textContent = `${state.partner1} & ${state.partner2}`;
      document.getElementById('sync-code-badge').textContent = state.pairCode;

      const openCount = state.shopping.filter(i => !i.done).length;
      const badge = document.getElementById('cart-badge');
      if (openCount > 0) {
        badge.textContent = openCount;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
      } else {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      }

      ['randomizer', 'meals', 'shopping', 'plan'].forEach(tab => {
        const btn = document.getElementById('nav-' + tab);
        const pill = btn.querySelector('.nav-pill');
        if (tab === currentTab) {
          btn.classList.add('text-[#FF8A5B]');
          btn.classList.remove('text-[#C7B2AA]');
          pill.classList.add('bg-[#4A2518]');
        } else {
          btn.classList.remove('text-[#FF8A5B]');
          btn.classList.add('text-[#C7B2AA]');
          pill.classList.remove('bg-[#4A2518]');
        }
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      updateHeaderAndBadges();
      render();
    }

    function getFilteredMeals() {
      return state.meals.filter(m => {
        if (!m.active) return false;
        if (selectedFilter !== 'alle' && !(m.tags || []).includes(selectedFilter)) return false;
        if (m.time > maxTimeFilter) return false;
        if (isOnCooldown(m)) return false;
        return true;
      });
    }

    function spinRandomizer() {
      const pool = getFilteredMeals();
      if (pool.length === 0) {
        showToast(state.cooldownDays ? 'Keine Gerichte übrig – Filter oder Wiederholungssperre anpassen' : 'Keine passenden Gerichte im Filter!');
        return;
      }
      if (isRolling) return;
      isRolling = true;

      let steps = 0;
      const interval = setInterval(() => {
        pickedMeal = pool[Math.floor(Math.random() * pool.length)];
        render();
        steps++;
        if (steps >= 14) {
          clearInterval(interval);
          isRolling = false;
          if (navigator.vibrate) navigator.vibrate([40, 60, 80]);
          render();
        }
      }, 75);
    }

    function confirmMealToday(mealId) {
      const meal = state.meals.find(m => m.id === mealId);
      if (!meal) return;
      const dateStr = new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
      state.history.unshift({ id: 'h_' + Date.now(), mealId: meal.id, name: meal.name, emoji: meal.emoji, date: dateStr });
      state.history = state.history.slice(0, 15);
      pushCloudState();
      showToast(`🎉 "${meal.name}" für heute ausgewählt!`);
      render();
    }

    function addMealIngredientsToCart(mealId) {
      const meal = state.meals.find(m => m.id === mealId);
      if (!meal || !meal.ingredients || meal.ingredients.length === 0) {
        showToast('Keine Zutaten hinterlegt.');
        return;
      }
      let added = 0;
      meal.ingredients.forEach(ing => {
        const clean = ing.trim();
        if (!clean) return;
        const exists = state.shopping.some(item => item.text.toLowerCase() === clean.toLowerCase() && !item.done);
        if (!exists) {
          state.shopping.unshift({
            id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            text: clean,
            fromMeal: meal.name,
            done: false,
            addedBy: me()
          });
          added++;
        }
      });
      pushCloudState();
      showToast(`🛒 ${added} Zutat(en) auf die Einkaufsliste gesetzt!`);
      render();
    }

    function openMealModal(mealId = null) {
      const modal = document.getElementById('meal-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (mealId) {
        const meal = state.meals.find(m => m.id === mealId);
        document.getElementById('modal-title').textContent = 'Gericht bearbeiten';
        document.getElementById('meal-id').value = meal.id;
        document.getElementById('meal-name').value = meal.name;
        document.getElementById('meal-emoji').value = meal.emoji || '🍽️';
        document.getElementById('meal-time').value = meal.time || 25;
        document.getElementById('meal-ingredients').value = (meal.ingredients || []).join(', ');
        document.getElementById('meal-note').value = meal.note || '';
        modalSelectedTags = [...(meal.tags || [])];
      } else {
        document.getElementById('modal-title').textContent = 'Neues Gericht hinzufügen';
        document.getElementById('meal-id').value = '';
        document.getElementById('meal-name').value = '';
        document.getElementById('meal-emoji').value = '🍲';
        document.getElementById('meal-time').value = 25;
        document.getElementById('meal-ingredients').value = '';
        document.getElementById('meal-note').value = '';
        modalSelectedTags = ['schnell'];
      }
      renderModalTags();
    }

    function closeMealModal() {
      const modal = document.getElementById('meal-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleModalTag(tagId) {
      if (modalSelectedTags.includes(tagId)) {
        modalSelectedTags = modalSelectedTags.filter(t => t !== tagId);
      } else {
        modalSelectedTags.push(tagId);
      }
      renderModalTags();
    }

    function renderModalTags() {
      const container = document.getElementById('modal-tags');
      container.innerHTML = CATEGORIES.filter(c => c.id !== 'alle').map(c => {
        const active = modalSelectedTags.includes(c.id);
        return `<button type="button" onclick="toggleModalTag('${c.id}')" class="px-3 py-1.5 rounded-full text-xs font-bold border transition ${
          active ? 'bg-[#F26419] text-white border-[#F26419]' : 'bg-[#1A1210] text-[#C7B2AA] border-[#3E2C27]'
        }">${c.icon} ${c.label}</button>`;
      }).join('');
    }

    function saveMeal(e) {
      e.preventDefault();
      const id = document.getElementById('meal-id').value;
      const name = document.getElementById('meal-name').value.trim();
      if (!name) return;
      const emoji = document.getElementById('meal-emoji').value.trim() || '🍽️';
      const time = parseInt(document.getElementById('meal-time').value, 10) || 25;
      const ingredients = document.getElementById('meal-ingredients').value.split(',').map(s => s.trim()).filter(Boolean);
      const note = document.getElementById('meal-note').value.trim();

      if (id) {
        const idx = state.meals.findIndex(m => m.id === id);
        if (idx > -1) state.meals[idx] = { ...state.meals[idx], name, emoji, time, tags: modalSelectedTags, ingredients, note };
      } else {
        state.meals.unshift({ id: 'm_' + Date.now(), name, emoji, time, tags: modalSelectedTags, ingredients, note, active: true, addedBy: me() });
      }
      closeMealModal();
      pushCloudState();
      showToast('Gericht gespeichert ✓');
      render();
    }

    function toggleMealActive(mealId) {
      const meal = state.meals.find(m => m.id === mealId);
      if (meal) {
        meal.active = !meal.active;
        pushCloudState();
        render();
      }
    }

    function deleteMeal(mealId) {
      if (!confirm('Gericht wirklich löschen?')) return;

      render();

    function addShoppingItem(e) {

      const input = document.getElementById('shop-input');

      const val = input.value.trim();
      if (!val) return;
      state.shopping.unshift({ id: 's_' + Date.now(), text: val, done: false, addedBy: me() });
      input.value = '';
      pushCloudState();
      render();
    }

    function quickAddGrocery(name) {
      const exists = state.shopping.some(i => i.text.toLowerCase() === name.toLowerCase() && !i.done);

        return;

      state.shopping.unshift({ id: 's_' + Date.now(), text: name, done: false, addedBy: me() });
      pushCloudState();
      showToast(`+ ${name}`);
      render();

    function toggleShoppingDone(id) {

    function clearDoneShopping() {

                  `).join('')}

        `;
      }

      else if (currentTab === 'plan') {

      else if (currentTab === 'couple') {
        main.innerHTML = `

              <p class="text-xs text-[#C7B2AA] mb-4">Mit demselben Paar-Code synchronisieren sich eure Gerichte und die Einkaufsliste automatisch live!</p>
              
              <form onsubmit="saveCoupleSettings(event)" class="space-y-3">

                  <div>
                    <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Dein Name</label>
                    <input id="input-p1" value="${esc(state.partner1)}" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-bold text-white" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-[#C7B2AA] mb-1">Name Partnerin</label>
                    <input id="input-p2" value="${esc(state.partner2)}" class="w-full px-3.5 py-2.5 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-sm font-bold text-white" />

                  Speichern & Synchronisieren

              </form>

  <script>
    // === THEME-ERWEITERUNG: Design-Auswahl (Orange/Pink), pro Gerät gespeichert, nicht synchronisiert ===
    (function () {
      const KEY = 'essens_theme_v1';
      function getTheme() { try { return localStorage.getItem(KEY) === 'pink' ? 'pink' : 'orange'; } catch (e) { return 'orange'; } }
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'pink' ? '#C2185B' : '#D94E1F');
      }
      window.setAppTheme = function (t) {
        try { localStorage.setItem(KEY, t); } catch (e) {}
        applyTheme(t);
        render();
      };
      function injectThemeCard() {
        if (currentTab !== 'couple') return;
        const wrap = document.querySelector('#main-content > div');
        if (!wrap || document.getElementById('theme-card')) return;
        const t = getTheme();
        const btn = (id, label) => `<button type="button" onclick="setAppTheme('${id}')" class="py-3 rounded-2xl text-xs font-extrabold border transition ${
          t === id ? 'bg-[#F26419] text-white border-[#F26419]' : 'bg-[#1A1210] text-[#C7B2AA] border-[#3E2C27]'}">${label}</button>`;
        wrap.insertAdjacentHTML('beforeend', `
          <div id="theme-card" class="bg-[#261B18] rounded-3xl p-5 border border-[#3E2C27]">
            <h2 class="text-base font-extrabold text-white mb-1">🎨 Design</h2>
            <p class="text-xs text-[#C7B2AA] mb-4">Gilt nur auf diesem Gerät.</p>
            <div class="grid grid-cols-2 gap-3">${btn('orange', '🟠 Orange')}${btn('pink', '🌸 Pink')}</div>
          </div>`);
      }
      const originalRender = render;
      render = function () { originalRender(); injectThemeCard(); };
      applyTheme(getTheme());
    })();
  </script>
  <script>
    // === BENACHRICHTIGUNGS-ERWEITERUNG: Tägliche Essens-Erinnerung & Partner-Push ===
    (function () {
      const KEY = 'essens_notify_v1';
      function loadCfg() {
        try {
          const r = JSON.parse(localStorage.getItem(KEY) || '{}');
          return { enabled: !!r.enabled, time: r.time || '16:30', lastFired: r.lastFired || '' };
        } catch (e) { return { enabled: false, time: '16:30', lastFired: '' }; }
      }
      function saveCfg(cfg) {
        try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
      }

      function getSmartText() {
        const todayIdx = (new Date().getDay() + 6) % 7;
        const planned = typeof planMeal === 'function' ? planMeal(todayIdx) : null;
        const openShop = (state.shopping || []).filter(i => !i.done).length;
        let body = planned
          ? `Heute im Wochenplan: ${planned.emoji || '🍲'} ${planned.name} (${planned.time} Min.)`
          : `Wollt ihr heute den Randomizer für euer Abendessen werfen? 🎲`;
        if (openShop > 0) body += ` · 🛒 Noch ${openShop} Artikel auf der Einkaufsliste.`;
        return body;
      }

      async function fireLocalNotification(title, body) {
        if (!('Notification' in window)) { showToast(body); return false; }
        if (Notification.permission !== 'granted') {
          const p = await Notification.requestPermission();
          if (p !== 'granted') { showToast('⚠️ Bitte Benachrichtigungen im Browser erlauben'); return false; }
        }
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg && reg.showNotification) {
              await reg.showNotification(title, { body, icon: GLOBAL_ICON_URL || undefined, vibrate: [60, 80, 100] });
              return true;
            }
          }
          new Notification(title, { body, icon: GLOBAL_ICON_URL || undefined });
          return true;
        } catch (e) {
          showToast(body);
          return false;
        }
      }

      window.toggleSmartNotify = async function () {
        const cfg = loadCfg();
        if (!cfg.enabled) {
          if ('Notification' in window && Notification.permission !== 'granted') {
            const perm = await Notification.requestPermission();
            if (perm !== 'granted') {
              showToast('⚠️ Benachrichtigungs-Berechtigung wurde abgelehnt');
              render();
              return;
            }
          }
          cfg.enabled = true;
          saveCfg(cfg);
          showToast(`🔔 Tägliche Erinnerung um ${cfg.time} Uhr aktiviert!`);
        } else {
          cfg.enabled = false;
          saveCfg(cfg);
          showToast('🔕 Erinnerung deaktiviert');
        }
        render();
      };

      window.changeSmartNotifyTime = function (val) {
        if (!val) return;
        const cfg = loadCfg();
        cfg.time = val;
        cfg.lastFired = '';
        saveCfg(cfg);
        showToast(`⏰ Erinnerungszeit auf ${val} Uhr gestellt`);
      };

      window.testSmartNotify = async function () {
        const ok = await fireLocalNotification('🍽️ Unser Essen – Vorschau', getSmartText());
        if (ok) showToast('🔔 Test-Benachrichtigung gesendet!');
      };

      window.sendPartnerPush = async function () {
        const clean = (state.pairCode || 'JS27').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        const pushTopic = 'essens_push_jk_' + clean;
        const sender = typeof me === 'function' ? me() : state.partner1;
        const msg = `${sender} fragt: Was essen wir heute? 🎲 (${getSmartText()})`;
        try {
          await fetch(`https://ntfy.sh/${pushTopic}`, {
            method: 'POST',
            headers: { 'Title': 'Unser Essen - Erinnerung', 'Priority': 'high', 'Tags': 'stew,game_die' },
            body: msg
          });
          showToast('📲 Push-Erinnerung gesendet!');
        } catch (e) {
          showToast('⚠️ Konnte Push nicht senden');
        }
      };

      function checkDailySchedule() {
        const cfg = loadCfg();
        if (!cfg.enabled) return;
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        if (cfg.lastFired === todayStr) return;

        const [th, tm] = (cfg.time || '16:30').split(':').map(Number);
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const targetMins = (th || 16) * 60 + (tm || 30);

        if (nowMins >= targetMins) {
          const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
          const alreadyChosenToday = (state.history || []).some(h => (parseInt(String(h.id).slice(2), 10) || 0) >= todayStart);
          cfg.lastFired = todayStr;
          saveCfg(cfg);
          if (!alreadyChosenToday) {
            fireLocalNotification('🍽️ Zeit fürs Abendessen!', getSmartText());
          }
        }
      }

      function injectNotifyCard() {
        if (currentTab !== 'couple') return;
        const wrap = document.querySelector('#main-content > div');
        if (!wrap || document.getElementById('notify-card')) return;
        const cfg = loadCfg();
        const clean = (state.pairCode || 'JS27').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        const pushTopic = 'essens_push_jk_' + clean;
        const partnerName = state.me === 2 ? state.partner1 : state.partner2;

        wrap.insertAdjacentHTML('beforeend', `
          <div id="notify-card" class="bg-[#261B18] rounded-3xl p-5 border border-[#3E2C27] space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-base font-extrabold text-white">🔔 Smarte Erinnerungen</h2>
                <p class="text-xs text-[#C7B2AA]">Erinnert dich, falls heute noch kein Gericht gewählt wurde.</p>
              </div>
              <button type="button" onclick="toggleSmartNotify()" class="px-3.5 py-2 rounded-2xl text-xs font-extrabold border transition ${
                cfg.enabled ? 'bg-[#F26419] text-white border-[#F26419]' : 'bg-[#1A1210] text-[#C7B2AA] border-[#3E2C27]'
              }">
                ${cfg.enabled ? '🔔 Aktiv' : '🔕 Aus'}
              </button>
            </div>

            <div class="flex items-center justify-between gap-3 pt-1">
              <label class="text-xs font-bold text-[#C7B2AA]">Uhrzeit (auf diesem Gerät):</label>
              <input type="time" value="${esc(cfg.time)}" onchange="changeSmartNotifyTime(this.value)" class="px-3 py-2 rounded-xl bg-[#1A1210] border border-[#3E2C27] text-xs font-extrabold text-white" />
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button type="button" onclick="testSmartNotify()" class="py-2.5 px-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-xs font-bold text-[#C7B2AA] active:scale-95 transition">
                🔔 Vorschau testen
              </button>
              <button type="button" onclick="sendPartnerPush()" class="py-2.5 px-3 rounded-2xl bg-[#1A1210] border border-[#3E2C27] text-xs font-bold text-[#FF8A5B] active:scale-95 transition">
                📲 ${esc(partnerName)} anpingen
              </button>
            </div>

            <p class="text-[11px] text-[#C7B2AA] leading-relaxed pt-1 border-t border-[#382722]">
              💡 <b>Tipp für Hintergrund-Push:</b> Wenn ihr in der kostenlosen <a href="https://ntfy.sh" target="_blank" class="underline text-[#FF8A5B]">ntfy-App</a> das Thema <code class="bg-[#1A1210] px-1.5 py-0.5 rounded text-white">${esc(pushTopic)}</code> abonniert, kommt der Ping auch bei geschlossener App sofort an!
            </p>
          </div>
        `);
      }

      const prevRender = render;
      render = function () { prevRender(); injectNotifyCard(); };
      if (currentTab === 'couple') injectNotifyCard();

      setInterval(checkDailySchedule, 30000);
      setTimeout(checkDailySchedule, 2500);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDailySchedule(); });
    })();
  </script>
  <script>
    // === PWA-ERWEITERUNG: Service Worker + Hinweis auf neue Version ===
    (function () {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      let known = null;
      async function signature() {
        try {
          const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
          return r.headers.get('etag') || r.headers.get('last-modified');
        } catch (e) { return null; }
      }
      async function checkForUpdate() {
        const sig = await signature();
        if (!sig) return;
        if (known === null) { known = sig; return; }
        if (sig !== known) showUpdateBar();
      }
      function showUpdateBar() {
        if (document.getElementById('update-bar')) return;
        const b = document.createElement('button');
        b.id = 'update-bar';
        b.textContent = '🔄 Neue Version – tippen zum Aktualisieren';
        b.className = 'fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-[#F26419] text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-xl';
        b.onclick = () => location.reload();
        document.body.appendChild(b);
      }
      checkForUpdate();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
    })();
  </script>
</body>
</html>
